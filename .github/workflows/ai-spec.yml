name: AI Phase 1 - Copilot Spec & Discussion

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  copilot_spec_phase:
    if: contains(github.event.issue.labels.*.name, 'ai-task') && (github.event_name == 'issues' || github.event.comment.body != 'approved') && github.actor == 'mauicoder'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      copilot-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js & Copilot CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Gather Discussion & Run Copilot Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Fetch issue body and comments into context file (with fixed python f-string handling)
          python3 -c '
          import os, json, urllib.request
          token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPOSITORY")
          issue_number = os.environ.get("ISSUE_NUMBER")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          i_res = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{issue_number}", headers=headers)).read().decode("utf-8"))
          body = i_res.get("body", "")
          c_res = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments", headers=headers)).read().decode("utf-8"))

          context = f"ISSUE DESCRIPTION:\n{body}\n\nDISCUSSION HISTORY:\n"
          for c in c_res:
              username = c["user"]["login"]
              comment_body = c["body"]
              context += f"[{username}] : {comment_body}\n"

          with open("issue_context.txt", "w") as f:
              f.write(context)
          '

          # Run Copilot non-interactively to generate spec and open questions
          copilot --prompt "You are an expert embedded C++ software architect working on an ESP32 PlatformIO project. 
          Read 'issue_context.txt' for requirements and user feedback. Inspect src/ and platformio.ini.
          
          Provide:
          1. A structured implementation plan.
          2. Any Open Points / Clarifications needed before coding.
          Do not write code yet." --allow-all-tools --allow-all-paths --yes --output-file copilot_spec.md

      - name: Post Copilot Plan to Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let planText = fs.existsSync('copilot_spec.md') ? fs.readFileSync('copilot_spec.md', 'utf8') : "Failed to generate plan.";
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🤖 **Copilot Architect (Spec Phase)**:\n\n" + planText + "\n\n👉 **Reply with `approved` when requirements are finalized.**"
            });
            
