name: AI Phase 1 - Spec & Discussion

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  spec_phase:
    if: contains(github.event.issue.labels.*.name, 'ai-task') && !contains(github.event.issue.labels.*.name, 'approved') && github.actor == 'mauicoder'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      copilot-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Issue Context via GitHub API
        uses: actions/github-script@v7
        with:
          script: async () => {
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });

            let content = `ISSUE TITLE: ${issue.data.title}\n\nISSUE DESCRIPTION:\n${issue.data.body}\n\nDISCUSSION:\n`;
            for (const c of comments.data) {
              content += `[${c.user.login}]: ${c.body}\n`;
            }

            fs.writeFileSync('issue_context.txt', content);
          }

      - name: Install Node.js & Copilot CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Copilot Analysis
        run: |
          copilot -p "You are an expert C++ embedded software architect. Read issue_context.txt. Inspect src/ and platformio.ini. Provide a structured implementation plan and open questions. Do not write code yet." > copilot_spec.md

      - name: Post Plan to Issue
        uses: actions/github-script@v7
        with:
          script: async () => {
            const fs = require('fs');
            const plan = fs.existsSync('copilot_spec.md') ? fs.readFileSync('copilot_spec.md', 'utf8') : "Failed to generate plan.";
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **AI Architect (Spec Phase)**:\n\n${plan}\n\n👉 **Add the `approved` label to this issue when ready for implementation.**`
            });
          }
          
