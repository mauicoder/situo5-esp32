name: AI Phase 1 - Copilot Spec & Discussion

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  copilot_spec_phase:
    # Keep the job condition simple: only check the label and author
    if: contains(github.event.issue.labels.*.name, 'ai-task') && github.actor == 'mauicoder'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      copilot-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Comment is Approval (Halt Spec Phase if Approved)
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          CLEAN_COMMENT=$(echo "$COMMENT_BODY" | tr '[:upper:]' '[:lower:]' | tr -d '[:punct:]' | xargs)
          echo "Processed comment: '$CLEAN_COMMENT'"
          
          if [ "$CLEAN_COMMENT" = "approved" ]; then
            echo "Approval detected! Halting spec phase so implementation workflow can take over."
            exit 0
          else
            echo "Not an approval. Continuing with spec discussion cycle..."
          fi

      - name: Install Node.js & Copilot CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Gather Discussion & Run Copilot Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # 1. Fetch issue body and comments into context file
          python3 -c '
          import os, json, urllib.request
          token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPOSITORY")
          issue_number = os.environ.get("ISSUE_NUMBER")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          i_res = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{issue_number}", headers=headers)).read().decode("utf-8"))
          body = i_res.get("body", "")
          c_res = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments", headers=headers)).read().decode("utf-8"))

          context = f"ISSUE DESCRIPTION:\n{body}\n\nDISCUSSION HISTORY:\n"
          for c in c_res:
              username = c["user"]["login"]
              comment_body = c["body"]
              context += f"[{username}] : {comment_body}\n"

          with open("issue_context.txt", "w") as f:
              f.write(context)
          '

          # 2. Run Copilot non-interactively using the -p flag and standard redirection
          copilot -p "You are an expert embedded C++ software architect working on an ESP32 PlatformIO project. Read issue_context.txt for requirements and user feedback. Inspect the source code under src/ and platformio.ini. Provide a structured implementation plan and any open points or clarifications needed. Do not write code yet." > copilot_spec.md

      - name: Post Copilot Plan to Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let planText = fs.existsSync('copilot_spec.md') ? fs.readFileSync('copilot_spec.md', 'utf8') : "Failed to generate plan.";
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🤖 **Copilot Architect (Spec Phase)**:\n\n" + planText + "\n\n👉 **Reply with `approved` when requirements are finalized.**"
            });
            
