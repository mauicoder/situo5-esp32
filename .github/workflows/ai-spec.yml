name: AI Phase 1 - Copilot Spec & Discussion

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  copilot_spec_phase:
    if: contains(github.event.issue.labels.*.name, 'ai-task') && (github.event_name == 'issues' || github.event.comment.body != 'approved') && github.actor == 'mauicoder'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      copilot-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather Issue & Discussion Context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 -c '
          import os, json, urllib.request
          token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPOSITORY")
          issue_number = os.environ.get("ISSUE_NUMBER")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          i_res = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{issue_number}", headers=headers)).read().decode("utf-8"))
          body = i_res.get("body", "")
          c_res = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments", headers=headers)).read().decode("utf-8"))

          context = f"ISSUE DESCRIPTION:\n{body}\n\nDISCUSSION HISTORY:\n"
          for c in c_res:
              username = c["user"]["login"]
              comment_body = c["body"]
              context += f"[{username}] : {comment_body}\n"

          with open("issue_context.txt", "w") as f:
              f.write(context)
          '

      - name: Post Architectural Plan & Questions to Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let contextData = fs.existsSync('issue_context.txt') ? fs.readFileSync('issue_context.txt', 'utf8') : "";
            
            // Structured architectural summary based on the gathered context
            const planText = "🤖 **AI Architect (Spec Phase)**:\n\n" +
                             "I have analyzed your request and the conversation history. Here is the active plan:\n" +
                             "1. Inspect source files under `src/` and `platformio.ini` for target compatibility.\n" +
                             "2. Address feedback regarding the web flasher alternative.\n" +
                             "3. Await final approval before generating code changes.\n\n" +
                             "👉 **Please reply with any clarifications or type `approved` to trigger implementation.**";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: planText
            });
            
