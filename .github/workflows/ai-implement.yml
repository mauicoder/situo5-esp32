name: AI Phase 2 - Implementation & PR

on:
  issues:
    types: [labeled]

jobs:
  copilot_implement_phase:
    # Trigger ONLY when the 'approved' label is added to an issue that already has 'ai-task'
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'ai-task') && github.actor == 'mauicoder'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      copilot-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="ai/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Install Node.js & Copilot CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Set up Python & PlatformIO Core
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Generate Structured PRD/Task Artifact & Execute Copilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 -c '
          import os, json, urllib.request
          token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPOSITORY")
          issue_number = os.environ.get("ISSUE_NUMBER")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          i_res = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{issue_number}", headers=headers)).read().decode("utf-8"))
          title = i_res.get("title", "")
          body = i_res.get("body", "")
          
          c_res = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments", headers=headers)).read().decode("utf-8"))

          history = ""
          for c in c_res:
              username = c["user"]["login"]
              comment_body = c["body"]
              history += f"- **{username}**:\n{comment_body}\n\n"

          os.makedirs("docs/specs", exist_ok=True)
          spec_content = f"# PRD & Implementation Specification: Issue #{issue_number} - {title}\n\n## 1. Overview & Requirements\n{body}\n\n## 2. Clarification & Discussion Log\n{history}\n\n## 3. Implementation Task Breakdown\n- [ ] Task 1: Analyze existing source files under src/ and dependencies in platformio.ini.\n- [ ] Task 2: Implement core logic modifications based on approved requirements.\n- [ ] Task 3: Verify build compilation cleanly using PlatformIO.\n"
          
          with open("docs/specs/active-spec.md", "w") as f:
              f.write(spec_content)
          '

          copilot -p "Read docs/specs/active-spec.md. Follow the PRD and task breakdown precisely to implement the required changes in src/ or include/ for this ESP32 PlatformIO project."

      - name: Verify Build with PlatformIO
        run: pio run

      - name: Commit Changes & Push Feature Branch
        run: |
          git add docs/specs/active-spec.md src/ include/
          git commit -m "AI Agent implementation for Issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH_NAME"

      - name: Open Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const issueNum = context.issue.number;

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `AI Implementation for Issue #${issueNum}`,
              head: branchName,
              base: 'main',
              body: `Closes #${issueNum}\n\nAutomated implementation generated via GitHub Copilot CLI and verified with PlatformIO, complete with PRD and task artifacts.`
            });

            github.rest.issues.createComment({
              issue_number: issueNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **AI Agent**: Implementation complete! Pull Request created successfully: ${pr.data.html_url}`
            });
            
