name: AI Phase 2 - Implementation & PR

on:
  issue_comment:
    types: [created]

jobs:
  copilot_implement_phase:
    # Only run if the issue has the 'ai-task' label and the comment is made by you
    if: contains(github.event.issue.labels.*.name, 'ai-task') && github.actor == 'mauicoder'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      copilot-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Approval
        id: check_approval
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Clean up the comment: lowercase it, strip whitespace and punctuation
          CLEAN_COMMENT=$(echo "$COMMENT_BODY" | tr '[:upper:]' '[:lower:]' | tr -d '[:punct:]' | xargs)
          echo "Processed comment: '$CLEAN_COMMENT'"
          
          if [ "$CLEAN_COMMENT" = "approved" ]; then
            echo "is_approved=true" >> $GITHUB_OUTPUT
            echo "Approval detected! Proceeding with implementation..."
          else
            echo "is_approved=false" >> $GITHUB_OUTPUT
            echo "Comment is not an approval. Skipping implementation phase."
          fi

      - name: Stop if Not Approved
        if: steps.check_approval.outputs.is_approved != 'true'
        run: exit 0

      - name: Set up Git Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="ai/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Install Node.js & Copilot CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Set up Python & PlatformIO Core
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Save Spec Artifact & Execute Code Generation via Copilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # 1. Fetch final comments to write active-spec.md
          python3 -c '
          import os, json, urllib.request
          token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPOSITORY")
          issue_number = os.environ.get("ISSUE_NUMBER")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          c_res = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{issue_number}/comments", headers=headers)).read().decode("utf-8"))
          
          os.makedirs("docs/specs", exist_ok=True)
          with open("docs/specs/active-spec.md", "w") as f:
              f.write("# Approved Specification & Task Plan\n\n")
              for c in c_res:
                  f.write(f"### {c[\"user\"][\"login\"]}\n{c[\"body\"]}\n\n---\n")
          '

          # 2. Instruct Copilot to implement changes based on spec
          copilot -p "Read docs/specs/active-spec.md and implement the requested changes in the src/ or include/ directory for this ESP32 PlatformIO project."

      - name: Verify Build with PlatformIO
        run: pio run

      - name: Commit Changes & Push Feature Branch
        run: |
          git add docs/specs/active-spec.md src/ include/
          git commit -m "AI Agent implementation for Issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH_NAME"

      - name: Open Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const issueNum = context.issue.number;

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `AI Implementation for Issue #${issueNum}`,
              head: branchName,
              base: 'main',
              body: `Closes #${issueNum}\n\nAutomated implementation generated via GitHub Copilot CLI and verified with PlatformIO.`
            });

            github.rest.issues.createComment({
              issue_number: issueNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **AI Agent**: Implementation complete! Pull Request created successfully: ${pr.data.html_url}`
            });
            
