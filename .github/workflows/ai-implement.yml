name: AI Phase 2 - Implementation & PR

on:
  issues:
    types: [labeled]

jobs:
  implement_phase:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'ai-task') && github.actor == 'mauicoder'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      copilot-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="ai/issue-${{ github.event.issue.number }}"
          git fetch origin || true
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            git checkout "$BRANCH_NAME"
            git pull origin "$BRANCH_NAME" || true
          else
            git checkout -b "$BRANCH_NAME"
          fi
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Generate Clean Spec Artifact via GitHub API
        uses: actions/github-script@v7
        with:
          script: async () => {
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });

            let history = "";
            for (const c of comments.data) {
              history += `- **${c.user.login}**: ${c.body}\n`;
            }

            const spec = `# Approved Specification: Issue #${issue_number} - ${issue.data.title}\n\n## 1. Requirements\n${issue.data.body}\n\n## 2. Discussion & Context\n${history}\n\n## 3. Tasks\n- [ ] Implement changes in src/\n- [ ] Verify build with PlatformIO\n`;
            
            fs.mkdirSync('docs/specs', { recursive: true });
            fs.writeFileSync('docs/specs/active-spec.md', spec);
          }

      - name: Install Node.js & Copilot CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Set up Python & PlatformIO Core
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade platformio

      - name: Run Copilot Implementation
        run: copilot -p "Read docs/specs/active-spec.md. Implement the required changes in src/ or include/ for this ESP32 project."

      - name: Verify Build with PlatformIO
        run: pio run

      - name: Commit, Push & Open PR
        uses: actions/github-script@v7
        with:
          script: async () => {
            const exec = require('child_process').execSync;
            const branchName = process.env.BRANCH_NAME;
            const issueNum = context.issue.number;

            exec('git add docs/specs/active-spec.md src/ include/');
            
            const status = exec('git status --porcelain').toString();
            if (!status) {
              console.log("No changes to commit.");
              return;
            }

            exec(`git commit -m "AI Agent implementation for Issue #${issueNum}"`);
            exec(`git push origin "${branchName}" --force-with-lease`);

            const existingPrs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: 'open'
            });

            let prUrl = "";
            if (existingPrs.data.length > 0) {
              prUrl = existingPrs.data[0].html_url;
            } else {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `AI Implementation for Issue #${issueNum}`,
                head: branchName,
                base: 'main',
                body: `Closes #${issueNum}\n\nAutomated implementation generated via GitHub Copilot CLI and verified with PlatformIO.`
              });
              prUrl = pr.data.html_url;
            }

            await github.rest.issues.createComment({
              issue_number: issueNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **AI Agent**: Implementation complete! Pull Request ready: ${prUrl}`
            });
          }
          
