name: AI - Implement Approved Plan

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: ai-implementation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    # Only respond to /approve-plan on an ordinary issue that:
    # - is not a pull request
    # - currently has ai-awaiting-approval
    #
    # The repository owner must be the person approving the plan.
    if: >
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/approve-plan' &&
      contains(github.event.issue.labels.*.name, 'ai-awaiting-approval') &&
      github.event.comment.user.login == github.repository_owner

    runs-on: ubuntu-latest

    steps:
      - name: Approval accepted
        run: |
          echo "Implementation approved by repository owner."
          echo "Issue: #${{ github.event.issue.number }}"


  implement:
    needs: authorize

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @github/copilot

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create implementation branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="ai/issue-${ISSUE_NUMBER}"

          echo "Using branch: $BRANCH"

          git fetch origin

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch already exists. Checking it out."

            git fetch origin "$BRANCH:$BRANCH"
            git checkout "$BRANCH"

          else
            echo "Creating new branch from the current default branch."

            git checkout -b "$BRANCH"
          fi

      - name: Get issue and approved plan
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ai

          gh issue view "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --comments \
            > .ai/issue.txt

          echo "===== Issue and comments ====="
          cat .ai/issue.txt

      - name: Verify approved plan exists
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '^AI Implementation Plan' .ai/issue.txt; then
            echo "ERROR: No approved implementation plan was found."
            exit 1
          fi

          echo "Approved implementation plan found."

      - name: Implement approved plan
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          cat > .ai/implementation-prompt.txt <<'EOF'
          You are the implementation phase of an AI software-development
          workflow.

          A human has explicitly approved the implementation plan contained
          in the GitHub issue.

          Your job is to implement that approved plan in the current
          repository.

          IMPORTANT:

          You MAY:
          - inspect the repository
          - modify source code
          - modify headers
          - add tests
          - update documentation when required by the approved plan
          - run build and test commands
          - fix problems discovered during validation

          You MUST NOT:
          - create or switch Git branches
          - commit changes
          - push changes
          - create a pull request
          - merge anything
          - change the approved requirements without documenting why
          - modify unrelated functionality
          - remove tests merely to make them pass
          - weaken assertions merely to make tests pass
          - add secrets or credentials

          The surrounding GitHub Actions workflow handles git commits,
          pushing, and pull-request creation.

          Project:

          This is a C++ ESP32 project using PlatformIO.

          Requirements:

          1. Read and understand the complete GitHub issue and the approved
             implementation plan.

          2. Inspect:
             - platformio.ini
             - src/
             - include/
             - lib/
             - test/
             - existing documentation
             - existing architecture and conventions

          3. Implement the approved plan with the smallest appropriate
             change.

          4. Preserve existing behavior unless the approved plan explicitly
             changes it.

          5. Follow the project's existing C++ style.

          6. Consider ESP32-specific concerns including:
             - memory usage
             - heap allocation
             - stack usage
             - FreeRTOS behavior
             - blocking operations
             - watchdog behavior
             - timing
             - concurrency
             - persistent storage/NVS wear
             - hardware abstraction
             - boot behavior

          7. Add or modify automated tests where appropriate.

          8. Clearly distinguish tests that can run on the GitHub Actions
             runner from tests that require physical ESP32 hardware.

          9. Run:
             pio run

          10. If a test directory exists, run:
              pio test

          11. Fix implementation problems discovered by those tests.

          12. Re-check the final implementation against every acceptance
              criterion in the approved plan.

          13. Do not stop merely because the code compiles. Verify the
              actual requirements.

          When you finish, provide a concise summary containing:

          - files changed
          - what was implemented
          - tests added/changed
          - commands executed
          - test/build results
          - any hardware validation still required
          - any remaining concerns

          Do not commit or push anything.
          EOF

          copilot \
            -p "$(cat .ai/implementation-prompt.txt)" \
            -s \
            --no-ask-user \
            --allow-tool='shell' \
            --allow-tool='read' \
            --allow-tool='write' \
            > .ai/implementation.txt

          echo "===== Implementation summary ====="
          cat .ai/implementation.txt

      - name: Show changes
        shell: bash
        run: |
          echo "===== Git status ====="
          git status --short

          echo
          echo "===== Git diff ====="
          git diff --stat
          git diff

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail

          echo "Running PlatformIO build..."

          pio run

      - name: Run PlatformIO tests
        shell: bash
        run: |
          set -euo pipefail

          if [ -d test ]; then
            echo "Test directory found. Running PlatformIO tests..."
            pio test
          else
            echo "No test directory found. Skipping pio test."
          fi

      - name: Verify implementation against requirements
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > .ai/verification-prompt.txt <<'EOF'
          You are performing a final read-only verification of an AI-generated
          implementation.

          DO NOT modify any files.

          DO NOT commit anything.

          DO NOT push anything.

          DO NOT create a pull request.

          Inspect:

          1. The GitHub issue and approved implementation plan in:
             .ai/issue.txt

          2. The implementation summary in:
             .ai/implementation.txt

          3. The actual git diff.

          4. The repository source and tests.

          Determine whether the implementation satisfies every requirement
          and acceptance criterion in the approved plan.

          Pay particular attention to:
          - missing requirements
          - accidental unrelated changes
          - incorrect assumptions
          - broken APIs
          - regressions
          - inadequate tests
          - ESP32-specific problems
          - PlatformIO configuration problems
          - hardware-only requirements that cannot be validated in CI

          Return exactly one of:

          VERIFICATION PASSED

          or

          VERIFICATION FAILED

          If failed, list every concrete problem that must be fixed.

          If passed, list any hardware validation that still needs to be
          performed manually.
          EOF

          copilot \
            -p "$(cat .ai/verification-prompt.txt)" \
            -s \
            --no-ask-user \
            --allow-tool='shell' \
            --allow-tool='read' \
            > .ai/verification.txt

          echo "===== Verification ====="
          cat .ai/verification.txt

          if grep -q '^VERIFICATION FAILED' .ai/verification.txt; then
            echo
            echo "Implementation verification failed."
            exit 1
          fi

          if ! grep -q '^VERIFICATION PASSED' .ai/verification.txt; then
            echo
            echo "Could not determine a successful verification result."
            exit 1
          fi

      - name: Remove temporary AI files
        shell: bash
        run: |
          rm -rf .ai

      - name: Commit implementation
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes were produced."
            exit 1
          fi

          git add -A

          git commit \
            -m "AI: implement approved plan for issue #${ISSUE_NUMBER}"

      - name: Push implementation branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="ai/issue-${ISSUE_NUMBER}"

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="ai/issue-${ISSUE_NUMBER}"

          PR_URL="$(
            gh pr create \
              --repo "$REPOSITORY" \
              --head "$BRANCH" \
              --base "$(gh repo view "$REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')" \
              --title "AI: implement issue #${ISSUE_NUMBER}" \
              --body "## Summary

          This pull request was generated from the human-approved implementation plan for issue #${ISSUE_NUMBER}.

          ## Validation

          - PlatformIO build: passed
          - PlatformIO tests: passed where available
          - AI requirements verification: passed

          ## Review

          Human review is required before merging.

          Closes #${ISSUE_NUMBER}"
          )"

          echo "Created pull request:"
          echo "$PR_URL"

          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

      - name: Update issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh issue edit "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --add-label "ai-pr" \
            --remove-label "ai-awaiting-approval"

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body "AI implementation is complete and a pull request has been created:

          $PR_URL

          The pull request requires human review. It will not be merged automatically."
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # ------------------------------------------------------------
      # Install Copilot CLI
      # ------------------------------------------------------------

      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @github/copilot

      # ------------------------------------------------------------
      # Prepare branch
      # ------------------------------------------------------------

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create AI branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="ai/issue-${ISSUE_NUMBER}"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          git fetch origin

          if git ls-remote --exit-code \
              --heads origin "$BRANCH" >/dev/null 2>&1; then

            echo "Branch already exists."

            git checkout "$BRANCH"
            git pull origin "$BRANCH"

          else

            git checkout -b "$BRANCH"

          fi

      # ------------------------------------------------------------
      # Get issue + approved plan
      # ------------------------------------------------------------

      - name: Get issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .ai

          gh issue view "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --comments \
            > .ai/issue.txt

      - name: Verify approved plan exists
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "AI Implementation Plan" .ai/issue.txt; then
            echo "ERROR: No AI Implementation Plan found."
            exit 1
          fi

      # ------------------------------------------------------------
      # Create implementation prompt
      # ------------------------------------------------------------

      - name: Create implementation prompt
        shell: bash
        run: |
          cat > .ai/prompt.txt <<'EOF'
          You are the implementation agent for an ESP32 C++ project using
          PlatformIO.

          An implementation plan has been explicitly approved by the
          repository owner.

          You MUST implement the approved plan.

          ================================================================
          IMPORTANT RULES
          ================================================================

          The approved implementation plan is the specification.

          Do NOT:

          - invent new requirements
          - modify unrelated functionality
          - remove tests to make them pass
          - weaken assertions
          - bypass compiler errors
          - bypass failing tests
          - commit secrets
          - commit credentials
          - modify CI unless required by the approved plan
          - merge the pull request

          If the approved plan contains an ambiguity that prevents safe
          implementation, stop and report it instead of guessing.

          ================================================================
          STEP 1 - UNDERSTAND
          ================================================================

          Read:

          - issue
          - all issue comments
          - approved implementation plan
          - repository instructions
          - .github/copilot-instructions.md if present
          - AGENTS.md if present

          Then inspect:

          - platformio.ini
          - src/
          - include/
          - lib/
          - test/
          - .github/

          ================================================================
          STEP 2 - IMPLEMENT
          ================================================================

          Implement the approved plan.

          Follow the existing architecture and coding style.

          For ESP32 code pay particular attention to:

          - memory usage
          - dynamic allocation
          - stack usage
          - FreeRTOS concurrency
          - watchdog behavior
          - blocking operations
          - timing
          - GPIO/peripheral behavior
          - flash/NVS wear
          - WiFi/Bluetooth behavior where applicable

          Make the smallest reasonable change.

          ================================================================
          STEP 3 - TEST
          ================================================================

          Inspect platformio.ini and identify relevant environments.

          Run the appropriate builds.

          At minimum attempt:

              pio run

          If named environments exist, run the relevant ones:

              pio run -e <environment>

          If tests exist:

              pio test

          Add or update tests where appropriate.

          Never claim a test passed unless it actually ran.

          ================================================================
          STEP 4 - FIX
          ================================================================

          If build/tests fail:

          1. Inspect the failure.
          2. Determine whether it is caused by your changes.
          3. Fix the implementation.
          4. Run the test/build again.

          Repeat until successful or until an external limitation prevents
          further validation.

          Never disable a test merely to make CI green.

          ================================================================
          STEP 5 - ACCEPTANCE CRITERIA
          ================================================================

          Verify EVERY acceptance criterion from the approved plan.

          For each criterion determine:

          PASS
          FAIL
          NOT TESTABLE AUTOMATICALLY

          Hardware-dependent requirements must be explicitly identified.

          ================================================================
          STEP 6 - REVIEW YOUR CHANGES
          ================================================================

          Before finishing:

          - inspect git diff
          - inspect git status
          - check for unrelated changes
          - check for secrets
          - check generated files
          - check tests
          - check formatting
          - check that the implementation matches the plan

          ================================================================
          FINAL REPORT
          ================================================================

          Produce:

          ## Implementation Summary

          ...

          ## Files Changed

          ...

          ## Tests Executed

          ...

          ## Acceptance Criteria

          - [x] ...
          - [x] ...

          ## Hardware Validation

          ...

          ## Limitations

          ...

          IMPORTANT:

          The GitHub Actions workflow will create the commit and PR.

          You should modify the working tree but do not attempt to merge
          anything.
          EOF

      # ------------------------------------------------------------
      # Run Copilot implementation
      # ------------------------------------------------------------

      - name: Run AI implementation
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          copilot \
            --prompt "$(cat .ai/prompt.txt)" \
            --allow-tool 'shell' \
            --allow-tool 'write' \
            --allow-tool 'read'

      # ------------------------------------------------------------
      # Show changes
      # ------------------------------------------------------------

      - name: Show changes
        run: |
          git status --short
          git diff --stat
          git diff

      # ------------------------------------------------------------
      # PlatformIO validation
      # ------------------------------------------------------------

      - name: PlatformIO build
        shell: bash
        run: |
          set -euo pipefail

          echo "Running PlatformIO build..."

          pio run

      - name: PlatformIO tests
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "test" ] && find test -type f | grep -q .; then
            echo "Running PlatformIO tests..."
            pio test
          else
            echo "No PlatformIO tests found."
          fi

      # ------------------------------------------------------------
      # Final AI verification
      # ------------------------------------------------------------

      - name: Verify implementation against requirements
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          cat > .ai/verification.txt <<'EOF'
          Review the implementation currently present in the working tree.

          Compare it against the approved implementation plan and issue.

          Verify:

          1. Every requirement is implemented.
          2. Every acceptance criterion is satisfied.
          3. Appropriate tests exist.
          4. No unrelated functionality was changed.
          5. The implementation follows the existing architecture.
          6. PlatformIO build/test results are consistent with the claimed
             behavior.

          Do not modify files.

          Return exactly:

          ## Verification

          ### Requirements

          - PASS/FAIL - ...

          ### Acceptance Criteria

          - PASS/FAIL - ...

          ### Tests

          ...

          ### Problems

          ...

          ### Overall

          PASS

          or

          FAIL
          EOF

          copilot \
            --prompt "$(cat .ai/verification.txt)" \
            --allow-tool 'shell' \
            --allow-tool 'read' \
            > .ai/verification-result.txt

          cat .ai/verification-result.txt

          if grep -qE '^FAIL$' .ai/verification-result.txt; then
            echo "AI verification failed."
            exit 1
          fi

      # ------------------------------------------------------------
      # Commit
      # ------------------------------------------------------------

      - name: Commit changes
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Do not commit AI temporary files.
          rm -rf .ai

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes detected."
            exit 1
          fi

          git add -A

          git commit \
            -m "AI: implement issue #${ISSUE_NUMBER}"

      # ------------------------------------------------------------
      # Push branch
      # ------------------------------------------------------------

      - name: Push branch
        run: |
          git push \
            --set-upstream origin "$BRANCH"

      # ------------------------------------------------------------
      # Create PR
      # ------------------------------------------------------------

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --json title \
            --jq '.title')

          cat > .ai-pr-body.md <<EOF
          ## Summary

          Closes #${ISSUE_NUMBER}

          AI implementation based on the explicitly approved implementation
          plan.

          ## Validation

          PlatformIO build:

          \`pio run\`

          PlatformIO tests:

          \`pio test\`

          ## Review

          Please review:

          - implementation
          - tests
          - acceptance criteria
          - hardware-dependent behavior

          The PR has NOT been merged automatically.
          EOF

          PR_URL=$(gh pr create \
            --repo "$REPOSITORY" \
            --head "$BRANCH" \
            --base "$(gh repo view "$REPOSITORY" \
              --json defaultBranchRef \
              --jq '.defaultBranchRef.name')" \
            --title "AI: Implement #${ISSUE_NUMBER} - ${ISSUE_TITLE}" \
            --body-file .ai-pr-body.md)

          echo "Created PR:"
          echo "$PR_URL"

      # ------------------------------------------------------------
      # Update issue
      # ------------------------------------------------------------

      - name: Update issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --add-label "ai-pr" \
            --remove-label "ai-awaiting-approval"

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body "AI implementation completed and a pull request was created. Please review the PR before merging."
