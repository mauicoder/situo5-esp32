name: AI - Analyze and Plan

on:
  issues:
    types:
      - labeled
      - reopened
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: read
  copilot-requests: write

jobs:
  analyze:
    if: >
      github.event.issue.pull_request == null &&
      (
        (
          github.event_name == 'issues' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'ai-task'
        )
        ||
        (
          github.event_name == 'issues' &&
          github.event.action == 'reopened' &&
          contains(github.event.issue.labels.*.name, 'ai-task')
        )
        ||
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.issue.labels.*.name, 'ai-task') &&
          (
            github.event.comment.body == '/replan' ||
            github.event.comment.body == '/analyze'
          )
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Collect repository information
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ai

          echo "===== platformio.ini =====" > .ai/repository.txt

          if [ -f platformio.ini ]; then
            cat platformio.ini >> .ai/repository.txt
          else
            echo "WARNING: platformio.ini not found" >> .ai/repository.txt
          fi

          echo "" >> .ai/repository.txt
          echo "===== Repository files =====" >> .ai/repository.txt

          find . \
            -type f \
            -not -path './.git/*' \
            -not -path './.ai/*' \
            | sort \
            | head -500 \
            >> .ai/repository.txt

      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @github/copilot

      - name: Analyze issue
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching issue #$ISSUE_NUMBER..."

          gh issue view "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --comments \
            > .ai/issue.txt

          cat > .ai/prompt.txt <<'EOF'
          You are the planning phase of an AI software-development workflow.

          IMPORTANT:
          You are NOT implementing the issue.

          Do NOT:
          - modify source files
          - create a branch
          - commit anything
          - push anything
          - create a pull request
          - merge anything

          Your job is to inspect the GitHub issue and repository and produce
          either:

          1. A concise clarification request if important information is
             missing or ambiguous.

          OR

          2. A detailed implementation plan if the requirements are
             sufficiently clear.

          Repository context:

          - This is a C++ ESP32 project using PlatformIO.
          - platformio.ini is authoritative for the build environments.
          - Inspect the existing source tree and tests before proposing
            changes.
          - Follow existing project conventions.
          - Do not invent requirements that are not supported by the issue
            or repository.

          If clarification is required, begin your response EXACTLY with:

          AI Clarification Required

          Then list the questions that the human must answer.

          If the issue is sufficiently clear, begin your response EXACTLY with:

          AI Implementation Plan

          Then provide:

          ## Understanding of the requirement

          Explain what the issue is asking for.

          ## Requirements

          List the concrete functional and technical requirements.

          ## Acceptance criteria

          Provide objective criteria that can be used to determine whether
          the implementation is correct.

          ## Proposed architecture

          Explain how the change should fit into the existing codebase.

          ## Proposed changes

          List the files/components that should be changed and what should
          change in each.

          ## Tests

          Describe unit tests, integration tests, PlatformIO tests, or other
          automated validation that should be added or modified.

          ## Hardware validation

          Clearly identify anything that cannot be fully validated on the
          GitHub Actions runner and requires physical ESP32 hardware.

          ## Risks and edge cases

          Identify important failure modes, compatibility concerns, timing
          issues, memory concerns, persistence/NVS concerns, concurrency
          issues, or other risks relevant to this project.

          ## Definition of done

          Give a concise checklist describing when the implementation should
          be considered complete.

          End with:

          Human approval required.

          To approve this plan, comment:

          /approve-plan

          Do not implement anything during this phase.
          EOF

          echo "Running Copilot analysis..."

          copilot \
            -p "$(cat .ai/prompt.txt)" \
            -s \
            --no-ask-user \
            --allow-tool='shell' \
            --allow-tool='read' \
            > .ai/plan.txt

          echo "===== Copilot output ====="
          cat .ai/plan.txt

      - name: Ensure workflow labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Ensuring AI workflow labels exist..."

          gh label create "ai-task" \
            --repo "$REPOSITORY" \
            --color "1D76DB" \
            --description "Issue selected for AI analysis" \
            --force

          gh label create "ai-clarifying" \
            --repo "$REPOSITORY" \
            --color "FBCA04" \
            --description "AI needs clarification before planning" \
            --force

          gh label create "ai-awaiting-approval" \
            --repo "$REPOSITORY" \
            --color "B60205" \
            --description "AI plan is waiting for human approval" \
            --force

          gh label create "ai-pr" \
            --repo "$REPOSITORY" \
            --color "0E8A16" \
            --description "AI implementation pull request created" \
            --force

          gh label create "ai-failed" \
            --repo "$REPOSITORY" \
            --color "D93F0B" \
            --description "AI workflow failed" \
            --force

      - name: Publish clarification request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '^AI Clarification Required' .ai/plan.txt; then
            exit 0
          fi

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file .ai/plan.txt

          gh issue edit "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --add-label "ai-clarifying" \
            --remove-label "ai-task"

      - name: Publish implementation plan
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if grep -q '^AI Clarification Required' .ai/plan.txt; then
            exit 0
          fi

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file .ai/plan.txt

          gh issue edit "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --add-label "ai-awaiting-approval" \
            --remove-label "ai-task"

      - name: Clean temporary AI files
        if: always()
        shell: bash
        run: |
          rm -rf .ai
