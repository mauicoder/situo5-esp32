# yaml-language-server: $schema=https://github.com/SchemaStore/schemastore/raw/master/src/schemas/json/github-workflow.json

name: Release Firmware & Deploy Web Flasher

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Build Firmware & Deploy Web Flasher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio mkdocs-material mkdocs-git-revision-date-localized-plugin markdown-callouts mkdocs-callouts

      - name: Build Firmware Matrix & Generate Web Flasher Manifests
        run: |
          python3 scripts/build_web_flasher.py

      - name: Create Release Firmware Zip Archive
        run: |
          cd docs/firmware
          zip -r ../../firmware-release.zip .
          cd ../..

      - name: Attach Firmware Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-release.zip
            docs/firmware/heltec_wifi_lora_32_V3/firmware.bin
            docs/firmware/heltec_wifi_lora_32_V3_debug/firmware.bin
            docs/firmware/lilygo_t3_v16/firmware.bin
            docs/firmware/lilygo_t3_v16_debug/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Deploy Web Flasher to GitHub Pages
        run: |
          mkdocs gh-deploy --force
