
name: AI Issue-Driven Workflow (Copilot CLI)

on:
  issues:
    types: [labeled]

jobs:
  ai_agent_cycle:
    if: contains(github.event.issue.labels.*.name, 'ai-task')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      copilot-requests: write # Authenticates Copilot CLI via GITHUB_TOKEN

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & PlatformIO Core
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run GitHub Copilot CLI Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install or verify Copilot CLI if not pre-installed on the runner
          # Then execute your non-interactive prompt targeting the issue description
          echo "Processing issue: ${{ github.event.issue.title }}"
          
          # Example CLI execution (adjust command syntax based on latest package runner)
          # copilot run --max-ai-credits 31 --prompt "Fix issue: ${{ github.event.issue.title }}"
          
      - name: Compile ESP32 Firmware with PlatformIO
        run: pio run

      - name: Post Completion Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Copilot Agent**: Task processed and verified via PlatformIO compilation!'
            })
            
